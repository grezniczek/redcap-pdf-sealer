maintenance_cron_description = "Renew PDF Sealer built-in root, TSA and project certificates"
maintenance_title = "Automatic built-in certificate maintenance"
maintenance_help = "Hourly cron renews the root with its existing key within 820 days of expiry, activating a fresh TSA and refreshed CRL together. TSA/project certificates renew with fresh keys within 90 days of expiry or after their issuing root changes. Each run starts at most five project renewals within a 60-second work budget. Pending enrollment, provider changes and retired CAs defer project renewal. Failures retry with backoff. Revoked project signers are prioritized and pending CRL publication is retried. Revoked TSAs also receive fresh keys automatically. Root issuing-key revocation triggers a fresh root/TSA and bounded dependent-project recovery; new-root viewer trust must be distributed separately. Missing or corrupt PKI requires attention."
